name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build
        run: cargo build --release --locked

      - name: Generate test media
        shell: pwsh
        run: |
          New-Item -ItemType Directory media | Out-Null
          ffmpeg -loglevel error -f lavfi -i sine=d=2 -f lavfi -i testsrc=d=2 -shortest media/a.mkv
          ffmpeg -loglevel error -f lavfi -i sine=d=2 media/B.MP4
          ffmpeg -loglevel error -i media/a.mkv -c copy -metadata title=retagged media/a_retag.mkv

      - name: Hash file round trip (wildcards, uppercase extension)
        shell: pwsh
        working-directory: media
        run: |
          $dano = "..\target\release\dano.exe"
          & $dano -w *.*
          if ($LASTEXITCODE -ne 0) { throw "write failed" }
          # a.mkv and a_retag.mkv share the same stream hash, so only one of them is recorded
          $records = @(Get-Content dano_hashes.txt | Where-Object { $_ -like '*hash_value*' })
          if ($records.Count -ne 2) { throw "expected 2 records, found $($records.Count)" }
          & $dano -t *.*
          if ($LASTEXITCODE -ne 0) { throw "test failed" }
          & $dano -p --canonical-paths a.mkv B.MP4

      - name: Alternate data stream round trip
        shell: pwsh
        working-directory: media
        run: |
          $dano = "..\target\release\dano.exe"
          Remove-Item dano_hashes.txt
          $before = (Get-Item a.mkv).LastWriteTimeUtc
          & $dano -w -x a.mkv
          if ($LASTEXITCODE -ne 0) { throw "xattr write failed" }
          if (Test-Path dano_hashes.txt) { throw "hash file should not be written in xattr mode" }
          Get-Content a.mkv -Stream user.dano.checksum
          if ((Get-Item a.mkv).LastWriteTimeUtc -ne $before) { throw "modify time was not preserved" }
          & $dano -t a.mkv
          if ($LASTEXITCODE -ne 0) { throw "xattr test failed" }
          & $dano --clean a.mkv
          if ($LASTEXITCODE -ne 0) { throw "clean failed" }
          if (Get-Item a.mkv -Stream user.dano.checksum -ErrorAction SilentlyContinue) { throw "stream not removed" }

      - name: Stdin with CRLF line endings
        shell: pwsh
        working-directory: media
        run: |
          $dano = "..\target\release\dano.exe"
          "a.mkv`r`nB.MP4`r`n" | & $dano -w
          if ($LASTEXITCODE -ne 0) { throw "stdin write failed" }
          $records = @(Get-Content dano_hashes.txt | Where-Object { $_ -like '*hash_value*' })
          if ($records.Count -ne 2) { throw "expected 2 records, found $($records.Count)" }
          & $dano -t a.mkv B.MP4
          if ($LASTEXITCODE -ne 0) { throw "stdin test failed" }

      - name: Find ffmpeg next to dano.exe when it is not in PATH
        shell: pwsh
        working-directory: media
        run: |
          New-Item -ItemType Directory ..\side | Out-Null
          Copy-Item ..\target\release\dano.exe ..\side\
          # copy the real ffmpeg.exe, not the Chocolatey shim found in PATH
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName ..\side\ffmpeg.exe
          Remove-Item dano_hashes.txt
          $env:PATH = "$env:SystemRoot\System32"
          & ..\side\dano.exe -w a.mkv
          if ($LASTEXITCODE -ne 0) { throw "write failed" }
          $records = @(Get-Content dano_hashes.txt | Where-Object { $_ -like '*hash_value*' })
          if ($records.Count -ne 1) { throw "expected 1 record, found $($records.Count)" }

      - name: Twin comparison script (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $a = New-Item -ItemType Directory "twins\RAIZ-A\filmes é ação" -Force
          $b = New-Item -ItemType Directory "twins\RAIZ-B\filmes é ação" -Force
          ffmpeg -loglevel error -f lavfi -i sine=d=5 -f lavfi -i testsrc=d=5 -shortest "$a\igual.mkv"
          ffmpeg -loglevel error -f lavfi -i sine=d=5 -f lavfi -i testsrc2=d=5 -shortest "$a\Preço danificado.mkv"
          ffmpeg -loglevel error -f lavfi -i sine=d=3 "$a\SEM GEMEO.MP3"
          Copy-Item "$a\igual.mkv" $b
          Copy-Item "$a\Preço danificado.mkv" $b
          # corrupt the middle of the copy in B
          $victim = "$b\Preço danificado.mkv"
          $bytes = [IO.File]::ReadAllBytes($victim)
          $rng = [Random]::new(42)
          $start = [int]($bytes.Length / 3)
          for ($i = $start; $i -lt $start + [int]($bytes.Length / 3); $i++) { $bytes[$i] = $rng.Next(256) }
          [IO.File]::WriteAllBytes($victim, $bytes)

          $rootA = (Resolve-Path twins\RAIZ-A).Path + '\'
          $rootB = (Resolve-Path twins\RAIZ-B).Path + '\'
          $list = Join-Path $PWD 'twins\lista.txt'
          $lines = Get-ChildItem $rootA -Recurse -File | ForEach-Object FullName
          [IO.File]::WriteAllLines($list, [string[]]$lines, [Text.UTF8Encoding]::new($false))
          $dano = (Resolve-Path target\release\dano.exe).Path

          foreach ($shell in 'pwsh', 'powershell') {
            Write-Host "::group::$shell"
            $out = Join-Path $PWD "twins\out-$shell"
            # relative list path, from a directory other than the process start directory
            Push-Location twins
            & $shell -NoProfile -ExecutionPolicy Bypass -Command "Set-Location '$PWD'; & '..\scripts\comparar-gemeos.ps1' -Lista lista.txt -RaizA '$rootA' -RaizB '$rootB' -Saida '$out-rel' -Dano '$dano' -SemDecodificar; exit `$LASTEXITCODE"
            $relOk = $LASTEXITCODE -eq 0 -and (Test-Path "$out-rel\relatorio.csv")
            Pop-Location
            if (-not $relOk) { throw "${shell}: relative list path failed" }
            & $shell -NoProfile -ExecutionPolicy Bypass -File scripts\comparar-gemeos.ps1 -Lista $list -RaizA $rootA -RaizB $rootB -Saida $out -Dano $dano
            if ($LASTEXITCODE -ne 0) { throw "${shell}: script failed" }
            Write-Host "::endgroup::"
            $rows = Import-Csv "$out\relatorio.csv" -Delimiter ';' -Encoding UTF8
            $rows | Format-List Veredito, Relativo, HashA, HashB, ErrosA, ErrosB, Detalhe
            if ($rows.Count -ne 3) { throw "${shell}: expected 3 rows" }
            $v = @{}; $rows | ForEach-Object { $v[(Split-Path $_.Relativo -Leaf)] = $_.Veredito }
            if ($v['igual.mkv'] -ne 'STREAMS IGUAIS') { throw "${shell}: igual.mkv -> $($v['igual.mkv'])" }
            if ($v['Preço danificado.mkv'] -ne 'DIFERENTES: B DANIFICADA') { throw "${shell}: danificado -> $($v['Preço danificado.mkv'])" }
            if ($v['SEM GEMEO.MP3'] -ne 'AUSENTE EM B') { throw "${shell}: sem gemeo -> $($v['SEM GEMEO.MP3'])" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dano-windows-x86_64
          path: target/release/dano.exe
